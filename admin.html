<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Pendataan Olimpiade</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="masthead">
  <div class="inner">
    <div class="logo">OSN</div>
    <div>
      <div class="t1">Halaman Admin</div>
      <div class="t2">Pendataan Peserta Olimpiade</div>
    </div>
    <nav id="nav" class="hidden">
      <button class="btn sm" data-go="list">Daftar Formulir</button>
      <button class="btn sm" data-go="password">Ganti Password</button>
      <button class="btn sm" data-go="logout">Keluar</button>
    </nav>
  </div>
</header>
<main id="app"><div class="loading"><div class="spin"></div>Memuat…</div></main>

<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  'use strict';
  const { el, toast, modal, fmtWaktu, optionsFor, TYPE_LABEL } = U;
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  let token = sessionStorage.getItem('osn_admin_token') || '';

  async function api(action, payload) {
    try {
      return await U.api(action, Object.assign({ token }, payload || {}));
    } catch (e) {
      if (e.message === 'SESI_HABIS') { token = ''; sessionStorage.removeItem('osn_admin_token'); showLogin('Sesi berakhir, silakan masuk lagi.'); throw new Error('Sesi berakhir.'); }
      throw e;
    }
  }
  function busy(msg) { app.innerHTML = ''; app.appendChild(el('div', { class: 'loading' }, el('div', { class: 'spin' }), msg || 'Memuat…')); }
  function fillUrl(kode) { return new URL('index.html?kode=' + encodeURIComponent(kode), location.href).href; }

  nav.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (!go) return;
    if (go.dataset.go === 'list') showList();
    if (go.dataset.go === 'password') showPassword();
    if (go.dataset.go === 'logout') { api('logout').catch(() => {}); token = ''; sessionStorage.removeItem('osn_admin_token'); showLogin(); }
  });

  /* ================= LOGIN ================= */
  function showLogin(msg) {
    nav.classList.add('hidden');
    app.innerHTML = '';
    const pw = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Password admin' });
    const box = el('div');
    const go = async () => {
      btn.disabled = true;
      try {
        const d = await U.api('login', { password: pw.value });
        token = d.token; sessionStorage.setItem('osn_admin_token', token);
        if (d.passwordAwal) toast('Anda masih memakai password awal. Segera ganti password.', '');
        showList();
      } catch (e) { box.innerHTML = ''; box.appendChild(el('div', { class: 'notice bad' }, e.message)); btn.disabled = false; pw.select(); }
    };
    const btn = el('button', { class: 'btn primary lg', onclick: go }, 'Masuk');
    pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    app.appendChild(el('div', { class: 'narrow' }, el('div', { class: 'card' },
      el('h2', null, 'Masuk Admin'),
      msg ? el('div', { class: 'notice warn' }, msg) : null, box,
      el('label', { class: 'f' }, el('span', null, 'Password'), pw), btn)));
    pw.focus();
  }

  /* ================= DAFTAR FORMULIR ================= */
  let FORMS = [];
  async function showList() {
    nav.classList.remove('hidden');
    busy('Memuat daftar formulir…');
    try { FORMS = await api('listForms'); } catch (e) { if (token) { app.innerHTML = ''; app.appendChild(el('div', { class: 'notice bad' }, e.message)); } return; }
    app.innerHTML = '';
    app.appendChild(el('div', { class: 'row', style: 'margin-bottom:16px' },
      el('h1', { style: 'font-size:22px;margin:0' }, 'Daftar Formulir'), el('span', { class: 'spacer' }),
      el('button', { class: 'btn primary', onclick: () => showEditor(null) }, '+ Buat formulir baru')));
    if (!FORMS.length) { app.appendChild(el('div', { class: 'card muted' }, 'Belum ada formulir.')); return; }
    app.appendChild(el('div', { class: 'forms-grid' }, FORMS.map(formCard)));
  }

  function formCard(f) {
    const pct = f.targetSekolah ? Math.round(100 * f.jumlahSekolah / f.targetSekolah) : 0;
    const status = f.status !== 'buka' ? ['bad', 'Ditutup'] : (f.terbuka ? ['ok', 'Dibuka'] : ['bad', 'Lewat batas waktu']);
    return el('div', { class: 'card fcard' },
      el('div', { class: 'row' }, el('span', { class: 'badge ' + status[0] }, status[1]), el('span', { class: 'badge' }, f.jenjang.join(' + ')), el('span', { class: 'spacer' }), el('span', { class: 'kode', title: 'Kode masuk' }, f.kode)),
      el('h3', null, f.judul),
      el('div', null,
        el('div', { class: 'row small' }, el('span', null, `${f.jumlahSekolah} dari ${f.targetSekolah} sekolah mengisi`), el('span', { class: 'spacer' }), el('strong', null, `${f.jumlahMurid} murid`)),
        el('div', { class: 'progress', style: 'margin-top:6px' }, el('i', { style: `width:${pct}%` }))),
      f.batas ? el('div', { class: 'small muted' }, 'Batas: ' + fmtWaktu(f.batas.replace('T', ' ') + (f.batas.length <= 10 ? ' 23:59' : ''))) : null,
      el('div', { class: 'row' },
        el('button', { class: 'btn sm primary', onclick: () => showRekap(f.id) }, 'Rekap'),
        el('button', { class: 'btn sm', onclick: () => showEditor(f) }, 'Edit'),
        el('button', { class: 'btn sm', onclick: () => salinLink(f) }, 'Salin link'),
        el('button', { class: 'btn sm', onclick: () => toggle(f) }, f.status === 'buka' ? 'Tutup' : 'Buka'),
        el('button', { class: 'btn sm ghost', onclick: () => duplikat(f) }, 'Duplikat'),
        el('button', { class: 'btn sm ghost', style: 'color:var(--bad)', onclick: () => hapus(f) }, 'Hapus')));
  }

  async function salinLink(f) {
    const txt = `${f.judul}\nLink: ${fillUrl(f.kode)}\nKode: ${f.kode}`;
    try { await navigator.clipboard.writeText(txt); toast('Link & kode disalin. Tempel di grup WhatsApp.', 'ok'); }
    catch (e) { modal({ title: 'Salin link', body: el('textarea', { rows: 4, value: txt }), okText: 'Tutup', cancelText: null }); }
  }
  async function toggle(f) {
    try { await api('saveForm', { form: Object.assign({}, f, { status: f.status === 'buka' ? 'tutup' : 'buka' }) }); toast('Status diperbarui.', 'ok'); showList(); }
    catch (e) { toast(e.message, 'bad'); }
  }
  async function duplikat(f) {
    const c = JSON.parse(JSON.stringify(f));
    delete c.id; c.judul = f.judul + ' (salinan)'; c.kode = (f.kode + '-B').slice(0, 30); c.status = 'tutup';
    showEditor(c);
  }
  async function hapus(f) {
    const ok = await modal({ title: 'Hapus formulir?', danger: true, okText: 'Hapus',
      body: el('div', null, el('p', null, `“${f.judul}” akan dihapus dari daftar dan kode ${f.kode} tidak bisa dipakai lagi.`),
        el('p', { class: 'small muted' }, `Data ${f.jumlahMurid} murid tidak hilang: sheet datanya diberi nama HAPUS_… di Google Sheet sebagai cadangan.`)) });
    if (!ok) return;
    try { await api('deleteForm', { id: f.id }); toast('Formulir dihapus.', 'ok'); showList(); } catch (e) { toast(e.message, 'bad'); }
  }

  /* ================= EDITOR ================= */
  function defaultSchema() {
    return {
      identitas: [
        { id: 'jenjang', label: 'Jenjang', type: 'system', required: true },
        { id: 'kecamatan', label: 'Kecamatan', type: 'system', required: true },
        { id: 'npsn', label: 'NPSN', type: 'system', required: true },
        { id: 'nama_sekolah', label: 'Nama Satuan Pendidikan', type: 'system', required: true }],
      murid: [
        { id: 'nisn', label: 'NISN', type: 'nisn', required: true },
        { id: 'nama_murid', label: 'Nama Murid', type: 'text', required: true },
        { id: 'kelas', label: 'Kelas', type: 'select', required: true, perJenjang: true, options: [], optionsByJenjang: { SD: ['1', '2', '3', '4', '5', '6'], SMP: ['7', '8', '9'] } },
        { id: 'bidang_lomba', label: 'Bidang Lomba', type: 'select', required: true, options: ['Matematika', 'IPA', 'IPS'] },
        { id: 'guru_pendamping', label: 'Guru Pendamping', type: 'text', required: true }]
    };
  }

  function showEditor(src) {
    const isNew = !src || !src.id;
    const F = src ? JSON.parse(JSON.stringify(src)) : { judul: '', deskripsi: '', kode: '', status: 'buka', batas: '', jenjang: ['SD', 'SMP'], schema: defaultSchema() };
    F.schema.murid.forEach(q => q._key = Math.random());
    F.schema.identitas.forEach(q => q._key = Math.random());
    app.innerHTML = '';

    const judul = el('input', { value: F.judul, placeholder: 'Judul formulir' });
    const desk = el('textarea', { rows: 2, placeholder: 'Petunjuk singkat untuk kepala sekolah (opsional)' }); desk.value = F.deskripsi || '';
    const kode = el('input', { value: F.kode, placeholder: 'mis. OSN2026', style: 'text-transform:uppercase;font-family:ui-monospace,Consolas,monospace' });
    const batas = el('input', { type: 'datetime-local', value: F.batas && F.batas.length > 10 ? F.batas : (F.batas ? F.batas + 'T23:59' : '') });
    const status = el('select', null, el('option', { value: 'buka' }, 'Dibuka'), el('option', { value: 'tutup' }, 'Ditutup')); status.value = F.status;
    const jj = ['SD', 'SMP'].map(j => { const c = el('input', { type: 'checkbox', value: j }); c.checked = F.jenjang.includes(j); return c; });

    const secIdent = el('div', { class: 'qlist' });
    const secMurid = el('div', { class: 'qlist' });

    function renderSec(sec, list, box) {
      box.innerHTML = '';
      list.forEach((q, i) => box.appendChild(qEditor(q, i, list, () => renderSec(sec, list, box))));
    }
    function qEditor(q, i, list, rerender) {
      const sys = q.type === 'system';
      const label = el('input', { value: q.label, placeholder: 'Teks pertanyaan', oninput: e => q.label = e.target.value });
      const type = el('select', { disabled: sys }, (sys ? ['system'] : ['text', 'textarea', 'number', 'nisn', 'phone', 'date', 'select']).map(t => el('option', { value: t }, TYPE_LABEL[t])));
      type.value = q.type;
      type.addEventListener('change', () => { q.type = type.value; if (q.type === 'select') { q.options = q.options || []; q.optionsByJenjang = q.optionsByJenjang || { SD: [], SMP: [] }; } rerender(); });
      const req = el('input', { type: 'checkbox', disabled: sys }); req.checked = !!q.required; req.addEventListener('change', () => q.required = req.checked);
      const more = el('div', { class: 'qmore' });
      if (!sys) more.appendChild(el('input', { value: q.hint || '', placeholder: 'Keterangan kecil di bawah isian (opsional)', oninput: e => q.hint = e.target.value }));
      if (q.type === 'select') {
        const per = el('input', { type: 'checkbox' }); per.checked = !!q.perJenjang;
        per.addEventListener('change', () => { q.perJenjang = per.checked; rerender(); });
        more.appendChild(el('label', { class: 'chk' }, per, 'Pilihan berbeda untuk SD dan SMP'));
        const ta = (arr, set, ph) => { const t = el('textarea', { rows: 3, placeholder: ph }); t.value = (arr || []).join('\n'); t.addEventListener('input', () => set(t.value.split('\n'))); return t; };
        if (q.perJenjang) {
          more.appendChild(el('div', { class: 'grid2' },
            el('label', { class: 'f' }, el('span', null, 'Pilihan SD (satu per baris)'), ta(q.optionsByJenjang.SD, v => q.optionsByJenjang.SD = v, '1\n2\n3')),
            el('label', { class: 'f' }, el('span', null, 'Pilihan SMP (satu per baris)'), ta(q.optionsByJenjang.SMP, v => q.optionsByJenjang.SMP = v, '7\n8\n9'))));
        } else {
          more.appendChild(el('label', { class: 'f' }, el('span', null, 'Pilihan (satu per baris)'), ta(q.options, v => q.options = v, 'Matematika\nIPA\nIPS')));
        }
      }
      if (sys) more.appendChild(el('div', { class: 'small muted' }, q.id === 'nama_sekolah' ? 'Dipilih dari data master sekolah sesuai kecamatan.' : q.id === 'npsn' ? 'Terisi otomatis dari sekolah yang dipilih.' : 'Dipilih dari data master sekolah.'));
      const mv = (d) => { const j = i + d; if (j < 0 || j >= list.length || list[j].type === 'system') return; [list[i], list[j]] = [list[j], list[i]]; rerender(); };
      return el('div', { class: 'q' + (sys ? ' sys' : '') },
        el('div', { class: 'qmain' }, label, type, el('label', { class: 'chk' }, req, 'Wajib')),
        el('div', { class: 'qtools' }, sys ? el('span', { class: 'badge' }, 'Otomatis') : [
          el('button', { class: 'btn ghost icon', title: 'Naik', onclick: () => mv(-1) }, '↑'),
          el('button', { class: 'btn ghost icon', title: 'Turun', onclick: () => mv(1) }, '↓'),
          el('button', { class: 'btn ghost icon', title: 'Hapus pertanyaan', style: 'color:var(--bad)', onclick: async () => {
            if (q.id && !(await modal({ title: 'Hapus pertanyaan?', danger: true, okText: 'Hapus', body: `“${q.label}” akan dihapus dari formulir. Data yang sudah masuk untuk kolom ini tetap tersimpan di Google Sheet.` }))) return;
            list.splice(i, 1); rerender(); } }, '✕')]),
        more);
    }
    function addQ(list, rerender) { list.push({ label: '', type: 'text', required: false, options: [], optionsByJenjang: { SD: [], SMP: [] }, _key: Math.random() }); rerender(); setTimeout(() => { const ins = document.querySelectorAll('.qlist .q:last-child .qmain input'); }, 0); }

    const rI = () => renderSec('identitas', F.schema.identitas, secIdent);
    const rM = () => renderSec('murid', F.schema.murid, secMurid);
    rI(); rM();

    const save = async () => {
      const form = {
        id: F.id, judul: judul.value, deskripsi: desk.value, kode: kode.value, status: status.value,
        batas: batas.value, jenjang: jj.filter(c => c.checked).map(c => c.value),
        schema: { identitas: F.schema.identitas.map(strip), murid: F.schema.murid.map(strip) }
      };
      saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan…';
      try { const r = await api('saveForm', { form }); toast('Formulir tersimpan.', 'ok'); F.id = r.id; showList(); }
      catch (e) { toast(e.message, 'bad'); saveBtn.disabled = false; saveBtn.textContent = 'Simpan formulir'; }
    };
    function strip(q) { const o = Object.assign({}, q); delete o._key; return o; }
    const saveBtn = el('button', { class: 'btn primary lg', onclick: save }, 'Simpan formulir');

    app.appendChild(el('div', { class: 'row', style: 'margin-bottom:16px' },
      el('button', { class: 'btn ghost', onclick: showList }, '← Kembali'),
      el('h1', { style: 'font-size:22px;margin:0' }, isNew ? 'Formulir baru' : 'Edit formulir')));
    if (!isNew) app.appendChild(el('div', { class: 'notice info small' }, 'Mengubah atau menambah pertanyaan tidak menghapus data yang sudah masuk. Kolom baru akan kosong untuk sekolah yang sudah mengirim sebelumnya.'));
    app.appendChild(el('section', { class: 'card' },
      el('h2', null, 'Pengaturan'),
      el('label', { class: 'f' }, el('span', null, 'Judul formulir', el('span', { class: 'req' }, '*')), judul),
      el('label', { class: 'f' }, el('span', null, 'Deskripsi / petunjuk'), desk),
      el('div', { class: 'grid3' },
        el('label', { class: 'f' }, el('span', null, 'Kode masuk', el('span', { class: 'req' }, '*')), kode, el('small', null, 'Dibagikan ke kepala sekolah. Huruf/angka, 4–30 karakter.')),
        el('label', { class: 'f' }, el('span', null, 'Status'), status),
        el('label', { class: 'f' }, el('span', null, 'Batas waktu (opsional)'), batas, el('small', null, 'Setelah lewat, formulir otomatis tertutup.'))),
      el('div', { class: 'f' }, el('span', { style: 'font-weight:600;font-size:14px;display:block;margin-bottom:6px' }, 'Jenjang peserta'), el('div', { class: 'chips' }, jj.map(c => el('label', null, c, c.value))))));
    app.appendChild(el('section', { class: 'card' },
      el('h2', null, el('span', { class: 'step' }, '1'), 'Pertanyaan Identitas Sekolah'),
      el('p', { class: 'muted small' }, 'Diisi sekali per sekolah. Empat pertanyaan teratas otomatis dari data master (hanya teksnya yang bisa diubah).'),
      secIdent, el('button', { class: 'btn', onclick: () => addQ(F.schema.identitas, rI) }, '+ Tambah pertanyaan identitas')));
    app.appendChild(el('section', { class: 'card' },
      el('h2', null, el('span', { class: 'step' }, '2'), 'Kolom Tabel Murid'),
      el('p', { class: 'muted small' }, 'Setiap kolom diisi untuk setiap murid. Urutan di sini = urutan kolom di tabel.'),
      secMurid, el('button', { class: 'btn', onclick: () => addQ(F.schema.murid, rM) }, '+ Tambah kolom murid')));
    app.appendChild(el('div', { class: 'sticky-bar row end' },
      F.kode && !isNew ? el('a', { class: 'btn ghost', href: fillUrl(F.kode), target: '_blank' }, 'Lihat formulir ↗') : null,
      el('button', { class: 'btn', onclick: showList }, 'Batal'), saveBtn));
  }

  /* ================= REKAP ================= */
  async function showRekap(id) {
    busy('Memuat rekap…');
    let d;
    try { d = await api('getRekap', { id }); } catch (e) { toast(e.message, 'bad'); return showList(); }
    const f = d.form, rows = d.rows, cols = f.schema.murid, ident = f.schema.identitas.filter(q => q.type !== 'system');
    const selCols = cols.filter(q => q.type === 'select');
    const sekMap = {}; d.sekolah.forEach(s => sekMap[s[0]] = s);
    // per sekolah
    const perSek = {};
    rows.forEach(r => { (perSek[r.npsn] = perSek[r.npsn] || { npsn: r.npsn, nama: r.nama_sekolah, kec: r.kecamatan, jenjang: r.jenjang, waktu: r.waktu, n: 0, r }).n++; });
    const sudah = Object.values(perSek).sort((a, b) => (a.kec + a.nama).localeCompare(b.kec + b.nama));
    const belum = d.sekolah.filter(s => !perSek[s[0]]).sort((a, b) => (a[3] + a[1]).localeCompare(b[3] + b[1]));
    const nisnCount = {}; rows.forEach(r => { if (r.nisn) nisnCount[r.nisn] = (nisnCount[r.nisn] || 0) + 1; });
    const dupN = Object.values(nisnCount).filter(n => n > 1).length;
    const kecList = [...new Set(d.sekolah.map(s => s[3]))].sort();

    app.innerHTML = '';
    app.appendChild(el('div', { class: 'row', style: 'margin-bottom:6px' },
      el('button', { class: 'btn ghost', onclick: showList }, '← Kembali'),
      el('span', { class: 'spacer' }),
      el('button', { class: 'btn', onclick: () => showRekap(id) }, '↻ Muat ulang'),
      el('button', { class: 'btn gold', onclick: () => unduh() }, '⬇ Unduh Excel')));
    app.appendChild(el('div', { class: 'form-title' }, el('h1', { style: 'font-size:21px' }, f.judul), el('div', { class: 'meta' }, el('span', { class: 'kode badge gold' }, 'Kode ' + f.kode), el('span', { class: 'badge ' + (f.terbuka ? 'ok' : 'bad') }, f.terbuka ? 'Dibuka' : 'Ditutup'))));
    const byBidang = {};
    const bid = cols.find(q => q.id === 'bidang_lomba') || selCols[0];
    if (bid) rows.forEach(r => { const k = r[bid.id] || '(kosong)'; byBidang[k] = (byBidang[k] || 0) + 1; });
    app.appendChild(el('div', { class: 'stats' },
      stat(`${sudah.length} / ${d.sekolah.length}`, 'Sekolah sudah mengisi'),
      stat(rows.length, 'Murid peserta'),
      bid ? Object.entries(byBidang).sort().map(([k, v]) => stat(v, bid.label + ': ' + k)) : null,
      dupN ? stat(dupN, 'NISN terdaftar ganda', 'var(--bad)') : null));

    const tabs = el('div', { class: 'tabs' });
    const body = el('div');
    const T = [['peserta', 'Peserta (' + rows.length + ')'], ['sekolah', 'Per Sekolah (' + sudah.length + ')'], ['belum', 'Belum Mengisi (' + belum.length + ')'], ['kec', 'Per Kecamatan']];
    let cur = 'peserta';
    T.forEach(([k, l]) => tabs.appendChild(el('button', { class: k === cur ? 'on' : '', onclick: e => { cur = k; tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target)); draw(); } }, l)));
    app.appendChild(el('div', { class: 'card' }, tabs, body));

    // filter state
    const flt = { kec: '', jenjang: '', q: '' }; selCols.forEach(q => flt[q.id] = '');
    function filters(withSel) {
      const mk = (key, label, opts) => { const s = el('select', null, el('option', { value: '' }, label), opts.map(o => el('option', { value: o }, o))); s.value = flt[key]; s.addEventListener('change', () => { flt[key] = s.value; drawTable(); }); return s; };
      const qi = el('input', { type: 'search', placeholder: 'Cari nama / NISN / sekolah…', value: flt.q });
      qi.addEventListener('input', () => { flt.q = qi.value; drawTable(); });
      return el('div', { class: 'filters' }, mk('kec', 'Semua kecamatan', kecList), f.jenjang.length > 1 ? mk('jenjang', 'Semua jenjang', f.jenjang) : null,
        withSel ? selCols.map(q => mk(q.id, 'Semua ' + q.label.toLowerCase(), [...new Set(rows.map(r => r[q.id]).filter(Boolean))].sort())) : null, qi);
    }
    let drawTable = () => {};
    const match = (o, kec, jen, txt) => (!flt.kec || kec === flt.kec) && (!flt.jenjang || jen === flt.jenjang) && (!flt.q || txt.toLowerCase().includes(flt.q.toLowerCase()));

    function draw() {
      body.innerHTML = '';
      if (cur === 'peserta') {
        const slot = el('div');
        body.append(filters(true), slot);
        drawTable = () => {
          const list = rows.filter(r => match(r, r.kecamatan, r.jenjang, [r.nama_murid, r.nisn, r.nama_sekolah, r.npsn, r.guru_pendamping].join(' ')) && selCols.every(q => !flt[q.id] || r[q.id] === flt[q.id]));
          slot.innerHTML = '';
          slot.appendChild(el('div', { class: 'small muted', style: 'margin-bottom:6px' }, `${list.length} baris` + (dupN ? ' · baris merah = NISN tercatat di lebih dari satu baris' : '')));
          slot.appendChild(el('div', { class: 'tbl-wrap', style: 'max-height:65vh' }, el('table', { class: 'data' },
            el('thead', null, el('tr', null, ['No', 'Kecamatan', 'Satuan Pendidikan', 'NPSN'].map(h => el('th', null, h)), ident.map(q => el('th', null, q.label)), cols.map(q => el('th', null, q.label)), el('th', null, 'Waktu'))),
            el('tbody', null, list.map((r, i) => el('tr', { class: nisnCount[r.nisn] > 1 ? 'dup' : '' },
              el('td', null, String(i + 1)), el('td', null, r.kecamatan), el('td', null, r.nama_sekolah), el('td', null, r.npsn),
              ident.map(q => el('td', null, r[q.id] || '')), cols.map(q => el('td', null, r[q.id] || '')), el('td', { class: 'small muted' }, fmtWaktu(r.waktu))))))));
        };
        drawTable();
      } else if (cur === 'sekolah') {
        const slot = el('div');
        body.append(filters(false), slot);
        drawTable = () => {
          const list = sudah.filter(s => match(s, s.kec, s.jenjang, s.nama + ' ' + s.npsn));
          slot.innerHTML = '';
          slot.appendChild(el('div', { class: 'tbl-wrap', style: 'max-height:65vh' }, el('table', { class: 'data' },
            el('thead', null, el('tr', null, ['No', 'Kecamatan', 'Satuan Pendidikan', 'NPSN', 'Jenjang', 'Jumlah Murid', 'Kiriman Terakhir', ''].map(h => el('th', null, h)))),
            el('tbody', null, list.map((s, i) => el('tr', null, el('td', null, String(i + 1)), el('td', null, s.kec), el('td', null, s.nama), el('td', null, s.npsn), el('td', null, s.jenjang), el('td', null, String(s.n)), el('td', { class: 'small' }, fmtWaktu(s.waktu)),
              el('td', null, el('button', { class: 'btn sm ghost', style: 'color:var(--bad)', onclick: async () => {
                if (!(await modal({ title: 'Hapus kiriman sekolah?', danger: true, okText: 'Hapus', body: `Data ${s.n} murid dari ${s.nama} akan dihapus dari rekap (riwayat tetap ada di sheet Arsip). Sekolah dapat mengisi lagi.` }))) return;
                try { await api('deleteSubmission', { id: f.id, npsn: s.npsn }); toast('Kiriman dihapus.', 'ok'); showRekap(id); } catch (e) { toast(e.message, 'bad'); }
              } }, 'Hapus'))))))));
        };
        drawTable();
      } else if (cur === 'belum') {
        const slot = el('div');
        body.append(filters(false), slot);
        drawTable = () => {
          const list = belum.filter(s => match(s, s[3], s[2], s[1] + ' ' + s[0]));
          slot.innerHTML = '';
          slot.appendChild(el('div', { class: 'small muted', style: 'margin-bottom:6px' }, `${list.length} sekolah belum mengisi`));
          slot.appendChild(el('div', { class: 'tbl-wrap', style: 'max-height:65vh' }, el('table', { class: 'data' },
            el('thead', null, el('tr', null, ['No', 'Kecamatan', 'Satuan Pendidikan', 'NPSN', 'Jenjang'].map(h => el('th', null, h)))),
            el('tbody', null, list.map((s, i) => el('tr', null, el('td', null, String(i + 1)), el('td', null, s[3]), el('td', null, s[1]), el('td', null, s[0]), el('td', null, s[2])))))));
        };
        drawTable();
      } else {
        body.appendChild(el('div', { class: 'tbl-wrap' }, el('table', { class: 'data' },
          el('thead', null, el('tr', null, ['No', 'Kecamatan', 'Jumlah Sekolah', 'Sudah Mengisi', 'Belum', '% ', 'Jumlah Murid'].map(h => el('th', null, h)))),
          el('tbody', null, kecRekap().map((k, i) => el('tr', null, el('td', null, String(i + 1)), el('td', null, k[0]), el('td', null, String(k[1])), el('td', null, String(k[2])), el('td', null, String(k[3])), el('td', null, k[4] + '%'), el('td', null, String(k[5]))))))));
      }
    }
    function kecRekap() {
      return kecList.map(k => {
        const tot = d.sekolah.filter(s => s[3] === k).length;
        const ss = sudah.filter(s => s.kec === k);
        return [k, tot, ss.length, tot - ss.length, tot ? Math.round(100 * ss.length / tot) : 0, ss.reduce((a, s) => a + s.n, 0)];
      });
    }
    draw();

    async function unduh() {
      try {
        toast('Menyiapkan file Excel…');
        await U.loadScript('assets/xlsx.full.min.js');
        const wb = XLSX.utils.book_new();
        const head = ['No', 'Kecamatan', 'Jenjang', 'NPSN', 'Nama Satuan Pendidikan', ...ident.map(q => q.label), ...cols.map(q => q.label), 'Waktu Kirim'];
        const sorted = rows.slice().sort((a, b) => (a.kecamatan + a.nama_sekolah).localeCompare(b.kecamatan + b.nama_sekolah) || (+a.no - +b.no));
        const peserta = [head, ...sorted.map((r, i) => [i + 1, r.kecamatan, r.jenjang, r.npsn, r.nama_sekolah, ...ident.map(q => r[q.id] || ''), ...cols.map(q => r[q.id] || ''), r.waktu])];
        addSheet(wb, 'Peserta', peserta);
        addSheet(wb, 'Per Sekolah', [['No', 'Kecamatan', 'Nama Satuan Pendidikan', 'NPSN', 'Jenjang', 'Jumlah Murid', 'Kiriman Terakhir'], ...sudah.map((s, i) => [i + 1, s.kec, s.nama, s.npsn, s.jenjang, s.n, s.waktu])]);
        addSheet(wb, 'Belum Mengisi', [['No', 'Kecamatan', 'Nama Satuan Pendidikan', 'NPSN', 'Jenjang'], ...belum.map((s, i) => [i + 1, s[3], s[1], s[0], s[2]])]);
        addSheet(wb, 'Per Kecamatan', [['No', 'Kecamatan', 'Jumlah Sekolah', 'Sudah Mengisi', 'Belum', 'Persen', 'Jumlah Murid'], ...kecRekap().map((k, i) => [i + 1, ...k])]);
        if (bid) addSheet(wb, 'Per ' + bid.label.slice(0, 20), [[bid.label, 'Jumlah Murid'], ...Object.entries(byBidang).sort()]);
        const stamp = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `Rekap_${f.kode}_${stamp}.xlsx`);
      } catch (e) { toast(e.message, 'bad'); }
    }
    function addSheet(wb, name, aoa) {
      // NISN & NPSN sebagai teks agar nol di depan tidak hilang
      const ws = XLSX.utils.aoa_to_sheet(aoa.map((r, i) => i === 0 ? r : r.map(v => v)));
      const head = aoa[0];
      ws['!cols'] = head.map((h, c) => ({ wch: Math.min(48, Math.max(String(h).length + 2, ...aoa.slice(1, 300).map(r => String(r[c] == null ? '' : r[c]).length + 1))) }));
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 0, c: head.length - 1 } }) };
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
    }
  }
  function stat(v, l, color) { return el('div', { class: 'stat' }, el('div', { class: 'v', style: color ? 'color:' + color : null }, String(v)), el('div', { class: 'l' }, l)); }

  /* ================= PASSWORD ================= */
  function showPassword() {
    app.innerHTML = '';
    const lama = el('input', { type: 'password', autocomplete: 'current-password' });
    const baru = el('input', { type: 'password', autocomplete: 'new-password' });
    const ulang = el('input', { type: 'password', autocomplete: 'new-password' });
    app.appendChild(el('div', { class: 'narrow' }, el('div', { class: 'card' },
      el('h2', null, 'Ganti Password Admin'),
      el('label', { class: 'f' }, el('span', null, 'Password lama'), lama),
      el('label', { class: 'f' }, el('span', null, 'Password baru'), baru, el('small', null, 'Minimal 8 karakter.')),
      el('label', { class: 'f' }, el('span', null, 'Ulangi password baru'), ulang),
      el('div', { class: 'row end' }, el('button', { class: 'btn', onclick: showList }, 'Batal'),
        el('button', { class: 'btn primary', onclick: async () => {
          if (baru.value !== ulang.value) return toast('Password baru tidak sama.', 'bad');
          try { await api('changePassword', { lama: lama.value, baru: baru.value }); toast('Password diganti.', 'ok'); showList(); } catch (e) { toast(e.message, 'bad'); }
        } }, 'Simpan')))));
  }

  if (token) showList(); else showLogin();
})();
</script>
